<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>QR Relay — Scanner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root, [data-theme="dark"] {
      --theme-bg: #282828;
      --theme-bg-dim: #202020;
      --theme-card: #32302f;
      --theme-card-hover: #3c3836;
      --theme-input-bg: #3c3836;
      --theme-input-border: #504945;
      --theme-border: #3c3836;
      --theme-border-light: #504945;
      --theme-text: #d4be98;
      --theme-text-bright: #ebdbb2;
      --theme-text-muted: #928374;
      --theme-accent: #7daea3;
      --theme-accent-hover: #89b482;
      --theme-button-bg: #45707a;
      --theme-button-hover: #5a858f;
      --theme-button-active: #3a5e66;
      --theme-button-fg: #ebdbb2;
      --theme-success: #a9b665;
      --theme-success-bg: rgba(169, 182, 101, 0.16);
      --theme-error: #ea6962;
      --theme-orange: #e78a4e;
      --theme-yellow: #d8a657;
      --theme-font-mono: 'JetBrains Mono', Consolas, 'Courier New', monospace;
      --theme-font-ui: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    [data-theme="light"] {
      --theme-bg: #fbf1c7;
      --theme-bg-dim: #efe4c9;
      --theme-card: #f2e5bc;
      --theme-card-hover: #ebdbb2;
      --theme-input-bg: #ebdbb2;
      --theme-input-border: #d5c4a1;
      --theme-border: #d5c4a1;
      --theme-border-light: #bdae93;
      --theme-text: #3c3836;
      --theme-text-bright: #282828;
      --theme-text-muted: #7c6f64;
      --theme-accent: #45707a;
      --theme-accent-hover: #5a858f;
      --theme-button-bg: #45707a;
      --theme-button-hover: #395c64;
      --theme-button-active: #2f4c52;
      --theme-button-fg: #fbf1c7;
      --theme-success: #6c782e;
      --theme-success-bg: rgba(108, 120, 46, 0.16);
      --theme-error: #c14a4a;
      --theme-orange: #c35e0a;
      --theme-yellow: #b47109;
    }

    body {
      font-family: var(--theme-font-ui);
      background: var(--theme-bg);
      color: var(--theme-text);
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .app-layout {
      max-width: 480px;
      height: 100dvh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      overflow: hidden;
      background: var(--theme-bg);
      transition: background 0.15s ease;
    }

    /* ---- Top Bar / Header ---- */
    .nav-bar {
      width: 100%;
      height: 38px;
      padding: 0 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      background: var(--theme-card);
      border-bottom: 1px solid var(--theme-border);
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .brand-mark {
      width: 22px;
      height: 22px;
      border-radius: 3px;
      background: var(--theme-bg);
      border: 1px solid var(--theme-border-light);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--theme-accent);
    }
    .brand-name {
      font-size: 0.86rem;
      font-weight: 600;
      color: var(--theme-text-bright);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge-label {
      font-size: 0.62rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 1px 5px;
      border-radius: 3px;
      background: var(--theme-bg);
      border: 1px solid var(--theme-border);
      color: var(--theme-text-muted);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-secondary {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--theme-bg);
      border: 1px solid var(--theme-border);
      border-radius: 3px;
      color: var(--theme-text);
      font-size: 0.72rem;
      font-weight: 500;
      font-family: inherit;
      padding: 4px 7px;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.12s, border-color 0.12s, color 0.12s;
      white-space: nowrap;
    }
    .btn-secondary:hover {
      background: var(--theme-card-hover);
      border-color: var(--theme-border-light);
      color: var(--theme-text-bright);
    }

    .btn-theme {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      background: var(--theme-bg);
      border: 1px solid var(--theme-border);
      border-radius: 3px;
      color: var(--theme-text);
      cursor: pointer;
      padding: 0;
      transition: background 0.12s, border-color 0.12s, color 0.12s;
      flex-shrink: 0;
    }
    .btn-theme:hover {
      background: var(--theme-card-hover);
      border-color: var(--theme-border-light);
      color: var(--theme-text-bright);
    }

    .telemetry-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--theme-bg);
      border: 1px solid var(--theme-border);
      border-radius: 3px;
      padding: 4px 7px;
      font-size: 0.68rem;
      font-weight: 600;
      font-family: var(--theme-font-mono);
      color: var(--theme-text-muted);
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--theme-error);
      transition: background 0.3s;
    }
    .status-dot.online {
      background: var(--theme-success);
    }

    /* ---- Camera Viewfinder Stage (Touches Edges Horizontally, 3:4 Ratio) ---- */
    .viewfinder-wrapper {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      flex-shrink: 0;
      position: relative;
    }

    .viewfinder-card {
      width: 100%;
      aspect-ratio: 3 / 4;
      max-height: calc(100dvh - 228px);
      background: #000;
      border-bottom: 1px solid var(--theme-border);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
    }
    .viewfinder-card video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.12s ease-out;
    }

    /* Reticle Corner Guides */
    .viewfinder-reticle {
      position: absolute;
      inset: 12px;
      pointer-events: none;
      z-index: 4;
      opacity: 0.4;
      transition: opacity 0.2s ease;
    }
    .viewfinder-card.has-qr .viewfinder-reticle {
      opacity: 0.95;
    }
    .reticle-corner {
      position: absolute;
      width: 18px;
      height: 18px;
      border-color: rgba(235, 219, 178, 0.8);
      border-style: solid;
      border-width: 0;
      transition: border-color 0.15s;
    }
    .reticle-tl { top: 0; left: 0; border-top-width: 2px; border-left-width: 2px; }
    .reticle-tr { top: 0; right: 0; border-top-width: 2px; border-right-width: 2px; }
    .reticle-bl { bottom: 0; left: 0; border-bottom-width: 2px; border-left-width: 2px; }
    .reticle-br { bottom: 0; right: 0; border-bottom-width: 2px; border-right-width: 2px; }
    .viewfinder-card.has-qr .reticle-corner {
      border-color: var(--theme-success);
    }

    /* Detection Bounding Box */
    .qr-bounding-box {
      position: absolute;
      border: 2px solid var(--theme-success);
      background: var(--theme-success-bg);
      border-radius: 2px;
      display: none;
      pointer-events: none;
      z-index: 5;
      transition: all 0.08s ease-out;
    }

    /* Status Banner on Viewfinder */
    .viewfinder-status {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--theme-card);
      border: 1px solid var(--theme-border-light);
      color: var(--theme-text);
      padding: 4px 10px;
      border-radius: 3px;
      font-size: 0.72rem;
      font-weight: 500;
      font-family: var(--theme-font-mono);
      pointer-events: none;
      white-space: nowrap;
      z-index: 6;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
    }
    .viewfinder-status.detected {
      background: var(--theme-success-bg);
      border-color: var(--theme-success);
      color: var(--theme-success);
    }

    /* ---- Controls Section (Space Effective) ---- */
    .controls-card {
      flex: 1;
      min-height: 0;
      padding: 10px 12px max(12px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: var(--theme-bg);
      justify-content: flex-start;
      transition: background 0.15s ease;
    }

    /* Primary Ready/Signal Button */
    .btn-signal {
      width: 100%;
      height: 42px;
      border: 1px solid var(--theme-accent);
      border-radius: 4px;
      background: var(--theme-button-bg);
      color: var(--theme-button-fg);
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.12s, border-color 0.12s, transform 0.08s;
      flex-shrink: 0;
    }
    .btn-signal:hover {
      background: var(--theme-button-hover);
    }
    .btn-signal:active {
      background: var(--theme-button-active);
      transform: scale(0.99);
    }
    .btn-signal.sent {
      background: var(--theme-success);
      border-color: var(--theme-success);
      color: #282828;
    }
    [data-theme="light"] .btn-signal.sent {
      color: #fbf1c7;
    }

    /* Full-Width Zoom Card (Takes Same Space As Ready Button) */
    .zoom-card {
      width: 100%;
      height: 42px;
      background: var(--theme-card);
      border: 1px solid var(--theme-border);
      border-radius: 4px;
      padding: 0 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
      box-sizing: border-box;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .zoom-btn {
      width: 28px;
      height: 28px;
      border-radius: 3px;
      background: transparent;
      border: 1px solid transparent;
      color: var(--theme-text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.12s, color 0.12s, border-color 0.12s;
      flex-shrink: 0;
    }
    .zoom-btn:hover {
      background: var(--theme-input-bg);
      color: var(--theme-text-bright);
      border-color: var(--theme-border-light);
    }
    .zoom-btn:active {
      transform: scale(0.94);
    }

    .zoom-slider {
      flex: 1;
      height: 6px;
      accent-color: var(--theme-accent);
      cursor: pointer;
      background: var(--theme-input-bg);
      border-radius: 3px;
      outline: none;
    }

    .zoom-readout {
      font-size: 0.78rem;
      font-weight: 600;
      font-family: var(--theme-font-mono);
      color: var(--theme-text-bright);
      min-width: 40px;
      text-align: center;
      padding: 3px 6px;
      background: var(--theme-bg);
      border: 1px solid var(--theme-border);
      border-radius: 3px;
      flex-shrink: 0;
    }

    /* Transmission Mode Toggle Bar (Space Effective) */
    .mode-bar {
      width: 100%;
      height: 34px;
      background: var(--theme-card);
      border: 1px solid var(--theme-border);
      border-radius: 4px;
      padding: 2px;
      display: flex;
      gap: 3px;
      flex-shrink: 0;
      box-sizing: border-box;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .mode-bar-btn {
      flex: 1;
      height: 100%;
      border: 1px solid transparent;
      background: transparent;
      color: var(--theme-text-muted);
      font-family: inherit;
      font-size: 0.72rem;
      font-weight: 600;
      border-radius: 3px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: background 0.12s, color 0.12s, border-color 0.12s;
      white-space: nowrap;
      padding: 0 4px;
    }
    .mode-bar-btn:hover {
      background: var(--theme-input-bg);
      color: var(--theme-text-bright);
    }
    .mode-bar-btn.active {
      background: var(--theme-button-bg);
      color: var(--theme-button-fg);
      border-color: var(--theme-accent);
    }
    .mode-speed-tag {
      font-size: 0.6rem;
      font-family: var(--theme-font-mono);
      font-weight: 700;
      padding: 1px 4px;
      border-radius: 2px;
      background: rgba(0, 0, 0, 0.22);
      letter-spacing: 0.02em;
    }
    [data-theme="light"] .mode-speed-tag {
      background: rgba(0, 0, 0, 0.12);
    }

    /* Tools Row: Camera Selection & Torch */
    .tools-row {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      flex-shrink: 0;
    }

    .tool-group {
      background: var(--theme-card);
      border: 1px solid var(--theme-border);
      border-radius: 4px;
      padding: 0 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      height: 36px;
      min-width: 0;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .tool-icon {
      color: var(--theme-text-muted);
      display: flex;
      flex-shrink: 0;
    }

    select.camera-dropdown {
      background: transparent;
      color: var(--theme-text);
      border: none;
      font-size: 0.8rem;
      font-weight: 500;
      font-family: inherit;
      outline: none;
      cursor: pointer;
      width: 100%;
      text-overflow: ellipsis;
      white-space: nowrap;
      overflow: hidden;
    }
    select.camera-dropdown option {
      background: var(--theme-card);
      color: var(--theme-text);
    }

    .btn-tool {
      background: var(--theme-card);
      border: 1px solid var(--theme-border);
      border-radius: 4px;
      color: var(--theme-text-muted);
      height: 36px;
      width: 42px;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.12s, color 0.12s, border-color 0.12s;
      flex-shrink: 0;
    }
    .btn-tool:hover {
      background: var(--theme-card-hover);
      color: var(--theme-text-bright);
      border-color: var(--theme-border-light);
    }
    .btn-tool.active {
      border-color: var(--theme-yellow);
      background: rgba(216, 166, 87, 0.16);
      color: var(--theme-yellow);
    }
  </style>
</head>
<body>
  <div class="app-layout">
    <!-- Top Navigation Bar -->
    <header class="nav-bar">
      <div class="brand-group">
        <div class="brand-mark">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
            <circle cx="12" cy="13" r="4"></circle>
          </svg>
        </div>
        <div class="brand-name">
          QR Relay <span class="badge-label">Scanner</span>
        </div>
      </div>

      <div class="nav-actions">
        <!-- Gruvbox Theme Toggle Button -->
        <button id="themeToggleBtn" class="btn-theme" type="button" title="Toggle Gruvbox Dark / Light mode" aria-label="Toggle theme">
          <svg id="themeIconDark" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
          <svg id="themeIconLight" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        </button>

        <a href="/viewer.html" class="btn-secondary" title="Switch to Viewer display">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
            <line x1="8" y1="21" x2="16" y2="21"></line>
            <line x1="12" y1="17" x2="12" y2="21"></line>
          </svg>
          Viewer
        </a>

        <div class="telemetry-chip">
          <span id="dot" class="status-dot"></span>
          <span id="peersVal">S:0 V:0</span>
          <span style="opacity: 0.3;">|</span>
          <span id="latencyVal">—</span>
        </div>
      </div>
    </header>

    <!-- Camera Viewfinder (3:4 Aspect Ratio, Touches Edges Horizontally) -->
    <div class="viewfinder-wrapper">
      <div class="viewfinder-card" id="cameraWrap">
        <div class="viewfinder-status" id="statusVal">
          Initializing camera...
        </div>

        <video id="video" autoplay playsinline muted></video>
        <div id="scanOverlay" class="qr-bounding-box"></div>

        <!-- Viewfinder Reticle Corner Guides -->
        <div class="viewfinder-reticle" aria-hidden="true">
          <span class="reticle-corner reticle-tl"></span>
          <span class="reticle-corner reticle-tr"></span>
          <span class="reticle-corner reticle-bl"></span>
          <span class="reticle-corner reticle-br"></span>
        </div>
      </div>
    </div>

    <!-- Controls Console (Space Effective) -->
    <section class="controls-card">
      <!-- 1. Ready Button -->
      <button id="readyBtn" class="btn-signal" type="button">
        <svg id="signalIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
        </svg>
        <span id="signalText">Signal Viewer (Ready)</span>
      </button>

      <!-- 2. Zoom Slider Card (Takes Same Space As Ready Button) -->
      <div class="zoom-card">
        <button id="zoomOutBtn" class="zoom-btn" type="button" title="Zoom out">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            <line x1="8" y1="11" x2="14" y2="11"></line>
          </svg>
        </button>

        <input id="zoomSlider" class="zoom-slider" type="range" min="1" max="1" step="0.1" value="1" disabled />

        <button id="zoomInBtn" class="zoom-btn" type="button" title="Zoom in">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            <line x1="11" y1="8" x2="11" y2="14"></line>
            <line x1="8" y1="11" x2="14" y2="11"></line>
          </svg>
        </button>

        <span class="zoom-readout" id="zoomVal">1.0×</span>
      </div>

      <!-- 3. Transmission Mode: Fast (Matrix Only) vs Dual (+ Photo Crop) -->
      <div class="mode-bar" role="radiogroup" aria-label="Relay transmission mode">
        <button id="modeFastBtn" class="mode-bar-btn active" type="button" role="radio" aria-checked="true" title="Fast Mode: Deactivates optical photo crop to stream pure reconstructed matrix at 1-3ms latency">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
          </svg>
          <span>Fast (Matrix Only)</span>
          <span class="mode-speed-tag">&lt;1KB</span>
        </button>
        <button id="modeDualBtn" class="mode-bar-btn" type="button" role="radio" aria-checked="false" title="Dual Mode: Reconstructs matrix AND includes downscaled camera photo crop (~45KB)">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <circle cx="8.5" cy="8.5" r="1.5"></circle>
            <polyline points="21 15 16 10 5 21"></polyline>
          </svg>
          <span>Dual (+ Photo)</span>
          <span class="mode-speed-tag">45KB</span>
        </button>
      </div>

      <!-- 4. Camera Selection & Torch Tools Row -->
      <div class="tools-row">
        <div class="tool-group">
          <span class="tool-icon">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
              <circle cx="12" cy="13" r="4"></circle>
            </svg>
          </span>
          <select id="camSelect" class="camera-dropdown"></select>
        </div>

        <button id="torchBtn" class="btn-tool" type="button" title="Toggle flashlight">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 2h6l2 7H7l2-7z"></path>
            <path d="M7 9v11a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V9"></path>
            <line x1="12" y1="12" x2="12" y2="16"></line>
          </svg>
        </button>
      </div>

    </section>
  </div>

  <script src="/static/js/qrcodegen.js"></script>
  <script src="/static/js/jsqr-enhanced.js"></script>
  <script src="/static/js/qr-preserver.js"></script>
  <script>
    /* ========== Theme Management (Gruvbox Material Dark / Light) ========== */
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    const themeIconDark  = document.getElementById('themeIconDark');
    const themeIconLight = document.getElementById('themeIconLight');

    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      try { localStorage.setItem('qr_relay_theme', theme); } catch (_) {}
      if (theme === 'light') {
        if (themeIconDark) themeIconDark.style.display = 'none';
        if (themeIconLight) themeIconLight.style.display = 'block';
      } else {
        if (themeIconDark) themeIconDark.style.display = 'block';
        if (themeIconLight) themeIconLight.style.display = 'none';
      }
    }

    const savedTheme = (() => {
      try { return localStorage.getItem('qr_relay_theme'); } catch (_) { return null; }
    })() || 'dark';
    applyTheme(savedTheme);

    if (themeToggleBtn) {
      themeToggleBtn.addEventListener('click', () => {
        const cur = document.documentElement.getAttribute('data-theme') || 'dark';
        applyTheme(cur === 'dark' ? 'light' : 'dark');
      });
    }

    /* ========== DOM Elements ========== */
    const video        = document.getElementById('video');
    const cameraWrap   = document.getElementById('cameraWrap');
    const overlay      = document.getElementById('scanOverlay');
    const dot          = document.getElementById('dot');
    const latencyVal   = document.getElementById('latencyVal');
    const peersVal     = document.getElementById('peersVal');
    const statusVal    = document.getElementById('statusVal');
    const camSelect    = document.getElementById('camSelect');
    const zoomSlider   = document.getElementById('zoomSlider');
    const zoomVal      = document.getElementById('zoomVal');
    const torchBtn     = document.getElementById('torchBtn');
    const readyBtn     = document.getElementById('readyBtn');
    const signalIcon   = document.getElementById('signalIcon');
    const signalText   = document.getElementById('signalText');
    const zoomOutBtn   = document.getElementById('zoomOutBtn');
    const zoomInBtn    = document.getElementById('zoomInBtn');
    const modeFastBtn  = document.getElementById('modeFastBtn');
    const modeDualBtn  = document.getElementById('modeDualBtn');

    /* ========== Transmission Mode Management ========== */
    let relayMode = (() => {
      try { return localStorage.getItem('qr_relay_mode'); } catch (_) { return null; }
    })() || 'fast';

    function setRelayMode(mode) {
      relayMode = mode === 'dual' ? 'dual' : 'fast';
      try { localStorage.setItem('qr_relay_mode', relayMode); } catch (_) {}
      if (relayMode === 'fast') {
        if (modeFastBtn) {
          modeFastBtn.classList.add('active');
          modeFastBtn.setAttribute('aria-checked', 'true');
        }
        if (modeDualBtn) {
          modeDualBtn.classList.remove('active');
          modeDualBtn.setAttribute('aria-checked', 'false');
        }
      } else {
        if (modeDualBtn) {
          modeDualBtn.classList.add('active');
          modeDualBtn.setAttribute('aria-checked', 'true');
        }
        if (modeFastBtn) {
          modeFastBtn.classList.remove('active');
          modeFastBtn.setAttribute('aria-checked', 'false');
        }
      }
    }
    setRelayMode(relayMode);

    if (modeFastBtn) modeFastBtn.addEventListener('click', () => setRelayMode('fast'));
    if (modeDualBtn) modeDualBtn.addEventListener('click', () => setRelayMode('dual'));

    /* ========== State ========== */
    const wsProto = location.protocol === 'https:' ? 'wss' : 'ws';
    const wsUrl   = `${wsProto}://${location.host}/ws`;
    let socket = null;
    let videoTrack = null;
    let activeStream = null;
    let lastQRText = null;
    let lastSeenQrTime = 0;
    let scanStarted = false;
    let lastScanTime = 0;
    let viewerCount = 0;
    let torchOn = false;
    let cachedVideoDevices = [];

    // Offscreen detection, ROI crop, and downscaled export canvases
    const detectCanvas = document.createElement('canvas');
    const detectCtx    = detectCanvas.getContext('2d', { willReadFrequently: true });
    const roiCanvas    = document.createElement('canvas');
    const roiCtx       = roiCanvas.getContext('2d', { willReadFrequently: true });
    const cropCanvas   = document.createElement('canvas');
    const cropCtx      = cropCanvas.getContext('2d', { willReadFrequently: true });

    // Pre-computed LUT for grayscale + contrast boost (factor=2.5, midpoint=128)
    const CONTRAST_LUT = new Uint8Array(256);
    (() => {
      const FACTOR = 2.5;
      for (let i = 0; i < 256; i++) {
        CONTRAST_LUT[i] = Math.max(0, Math.min(255, Math.round(FACTOR * (i - 128) + 128)));
      }
    })();

    function extractDownscaledCrop(bbox, scale, vw, vh) {
      if (!bbox || !scale || !vw || !vh) return null;
      const pad = 0.22;
      const fx = bbox.x / scale;
      const fy = bbox.y / scale;
      const fw = bbox.w / scale;
      const fh = bbox.h / scale;

      const side = Math.max(fw, fh);
      const paddedSide = side * (1 + pad * 2);
      const centerX = fx + fw / 2;
      const centerY = fy + fh / 2;
      const cx = Math.max(0, Math.round(centerX - paddedSide / 2));
      const cy = Math.max(0, Math.round(centerY - paddedSide / 2));
      const cw = Math.min(Math.round(paddedSide), vw - cx);
      const ch = Math.min(Math.round(paddedSide), vh - cy);
      const cropSide = Math.min(cw, ch);

      if (cropSide <= 20) return null;

      const CROP_SIZE = 360;
      cropCanvas.width = CROP_SIZE;
      cropCanvas.height = CROP_SIZE;
      cropCtx.drawImage(video, cx, cy, cropSide, cropSide, 0, 0, CROP_SIZE, CROP_SIZE);

      // Boost contrast and sharpen grayscale for clean QR legibility
      try {
        const imgData = cropCtx.getImageData(0, 0, CROP_SIZE, CROP_SIZE);
        const d = imgData.data;
        for (let i = 0; i < d.length; i += 4) {
          const gray = CONTRAST_LUT[Math.round(0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2])];
          d[i] = d[i + 1] = d[i + 2] = gray;
        }
        cropCtx.putImageData(imgData, 0, 0);
      } catch (_) {}

      return cropCanvas.toDataURL('image/jpeg', 0.88);
    }

    // Native BarcodeDetector (if available on Chrome/Android)
    let nativeDetector = null;
    let useNative = false;
    (async () => {
      if (window.BarcodeDetector) {
        try {
          const formats = await BarcodeDetector.getSupportedFormats();
          if (formats.includes('qr_code')) {
            nativeDetector = new BarcodeDetector({ formats: ['qr_code'] });
            useNative = true;
          }
        } catch (_) {}
      }
    })();

    /* ========== Ready / Attention Signaling ========== */
    let signalTimer = null;

    function sendReadySignal() {
      if (socket && socket.readyState === WebSocket.OPEN) {
        socket.send(JSON.stringify({ type: 'ring', action: 'start' }));
        try { localStorage.setItem('sender_sent_ring', String(Date.now())); } catch (_) {}

        readyBtn.classList.add('sent');
        signalIcon.innerHTML = `<polyline points="20 6 9 17 4 12"></polyline>`;
        signalText.textContent = 'Viewer Signaled';

        statusVal.className = 'viewfinder-status detected';
        statusVal.textContent = viewerCount > 0
          ? `Signal delivered to ${viewerCount} viewer(s)`
          : 'Signal sent (No viewers connected)';

        clearTimeout(signalTimer);
        signalTimer = setTimeout(() => {
          readyBtn.classList.remove('sent');
          signalIcon.innerHTML = `
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
          `;
          signalText.textContent = 'Signal Viewer (Ready)';
        }, 2200);
      } else {
        statusVal.textContent = 'Disconnected from relay';
      }
    }

    readyBtn.addEventListener('click', sendReadySignal);

    /* ========== WebSocket Connection ========== */
    let pingTimer = null;

    function connectWS() {
      socket = new WebSocket(wsUrl);

      socket.addEventListener('open', () => {
        dot.classList.add('online');
        socket.send(JSON.stringify({ type: 'role', role: 'sender' }));

        clearInterval(pingTimer);
        pingTimer = setInterval(() => {
          if (socket && socket.readyState === WebSocket.OPEN) {
            socket.send(JSON.stringify({ type: 'ping' }));
          }
        }, 20000);
      });

      socket.addEventListener('message', (ev) => {
        try {
          const msg = JSON.parse(ev.data);
          if (msg && msg.type === 'status') {
            viewerCount = msg.viewers || 0;
            peersVal.textContent = `S:${msg.senders} V:${msg.viewers}`;
          }
        } catch (_) {}
      });

      socket.addEventListener('close', () => {
        clearInterval(pingTimer);
        dot.classList.remove('online');
        peersVal.textContent = 'Offline';
        setTimeout(connectWS, 1500);
      });

      socket.addEventListener('error', () => {
        socket.close();
      });
    }

    /* ========== Camera Engine ========== */
    async function startCamera(deviceId) {
      if (activeStream) {
        activeStream.getTracks().forEach((t) => t.stop());
        activeStream = null;
        videoTrack = null;
      }

      const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
      const videoConstraints = {
        width:  { ideal: 1920, min: 640 },
        height: { ideal: 1080, min: 480 },
      };

      if (deviceId) {
        videoConstraints.deviceId = { exact: deviceId };
      } else {
        videoConstraints.facingMode = { ideal: 'environment' };
      }

      if (isMobile) {
        videoConstraints.focusMode = { ideal: 'continuous' };
        videoConstraints.exposureMode = { ideal: 'continuous' };
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: videoConstraints,
          audio: false,
        });

        activeStream = stream;
        video.srcObject = stream;
        videoTrack = stream.getVideoTracks()[0];

        await video.play();
        setupZoom();
        setupTorch();

        if (!scanStarted) {
          scanStarted = true;
          requestAnimationFrame(tick);
        }

        await populateCameras();
        statusVal.className = 'viewfinder-status';
        statusVal.textContent = 'Align QR in frame';
      } catch (err) {
        console.error('Camera error:', err);
        statusVal.textContent = 'Camera blocked: ' + err.message;
      }
    }

    async function populateCameras() {
      try {
        const devices = await navigator.mediaDevices.enumerateDevices();
        cachedVideoDevices = devices.filter((d) => d.kind === 'videoinput');

        camSelect.innerHTML = '';
        cachedVideoDevices.forEach((dev, idx) => {
          const opt = document.createElement('option');
          opt.value = dev.deviceId;
          opt.textContent = dev.label || `Camera ${idx + 1}`;
          camSelect.appendChild(opt);
        });

        if (videoTrack && videoTrack.getSettings) {
          const curId = videoTrack.getSettings().deviceId;
          if (curId) camSelect.value = curId;
        }
      } catch (_) {}
    }

    camSelect.addEventListener('change', () => {
      if (camSelect.value) startCamera(camSelect.value);
    });

    /* ========== Torch (Flashlight) Support ========== */
    function setupTorch() {
      if (!videoTrack || !videoTrack.getCapabilities) return;
      const caps = videoTrack.getCapabilities();
      if (caps.torch) {
        torchBtn.style.display = 'inline-flex';
        torchBtn.onclick = async () => {
          torchOn = !torchOn;
          try {
            await videoTrack.applyConstraints({ advanced: [{ torch: torchOn }] });
            torchBtn.classList.toggle('active', torchOn);
          } catch (_) {}
        };
      } else {
        torchBtn.style.display = 'none';
      }
    }

    /* ========== Zoom Controls ========== */
    function setupZoom() {
      if (!videoTrack) return;
      const caps = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};

      if (caps.zoom) {
        zoomSlider.min = caps.zoom.min;
        zoomSlider.max = caps.zoom.max;
        zoomSlider.step = caps.zoom.step || 0.1;
        const curZoom = (videoTrack.getSettings ? videoTrack.getSettings().zoom : null) || caps.zoom.min;
        zoomSlider.value = curZoom;
        zoomVal.textContent = `${Number(curZoom).toFixed(1)}×`;
        zoomSlider.disabled = false;
      } else {
        zoomSlider.min = 1.0;
        zoomSlider.max = 3.0;
        zoomSlider.step = 0.1;
        zoomSlider.value = 1.0;
        zoomSlider.disabled = false;
        zoomVal.textContent = '1.0×';
      }

      zoomSlider.oninput = () => applyZoom(parseFloat(zoomSlider.value));

      if (zoomOutBtn) {
        zoomOutBtn.onclick = () => {
          const step = parseFloat(zoomSlider.step) || 0.1;
          const cur = parseFloat(zoomSlider.value) || 1.0;
          const min = parseFloat(zoomSlider.min) || 1.0;
          applyZoom(Math.max(min, cur - step * 2));
        };
      }
      if (zoomInBtn) {
        zoomInBtn.onclick = () => {
          const step = parseFloat(zoomSlider.step) || 0.1;
          const cur = parseFloat(zoomSlider.value) || 1.0;
          const max = parseFloat(zoomSlider.max) || 3.0;
          applyZoom(Math.min(max, cur + step * 2));
        };
      }

      setupPinchToZoom(caps);
    }

    function applyZoom(val) {
      const caps = (videoTrack && videoTrack.getCapabilities) ? videoTrack.getCapabilities() : {};

      if (caps.zoom) {
        const clamped = Math.max(caps.zoom.min, Math.min(caps.zoom.max, val));
        videoTrack.applyConstraints({ advanced: [{ zoom: clamped }] }).catch(() => {});
        video.style.transform = '';
        zoomSlider.value = clamped;
        zoomVal.textContent = `${clamped.toFixed(1)}×`;
      } else {
        const minVal = parseFloat(zoomSlider.min) || 1.0;
        const maxVal = parseFloat(zoomSlider.max) || 3.0;
        const clamped = Math.max(minVal, Math.min(maxVal, val));
        video.style.transform = clamped === 1.0 ? '' : `scale(${clamped})`;
        zoomSlider.value = clamped;
        zoomVal.textContent = `${clamped.toFixed(1)}×`;
      }
    }

    function setupPinchToZoom(caps) {
      let pinchStartDist = 0;
      let pinchStartZoom = 1;

      cameraWrap.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2) {
          pinchStartDist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
          pinchStartZoom = parseFloat(zoomSlider.value) || 1;
        }
      }, { passive: true });

      cameraWrap.addEventListener('touchmove', (e) => {
        if (e.touches.length === 2 && pinchStartDist > 0) {
          const dist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
          applyZoom(pinchStartZoom * (dist / pinchStartDist));
        }
      }, { passive: true });

      cameraWrap.addEventListener('touchend', (e) => {
        if (e.touches.length < 2) pinchStartDist = 0;
      }, { passive: true });
    }

    /* ========== Detection & Exact Preservation Loop ========== */
    const SCAN_INTERVAL = 80;   // ms — ~12 Hz
    const DETECT_MAX_DIM = 480;  // fast downscaled frame

    async function tick() {
      requestAnimationFrame(tick);
      if (video.readyState < video.HAVE_ENOUGH_DATA) return;

      const now = performance.now();
      if (now - lastScanTime < SCAN_INTERVAL) return;
      lastScanTime = now;

      const vw = video.videoWidth;
      const vh = video.videoHeight;
      if (!vw || !vh) return;

      const scale = Math.min(DETECT_MAX_DIM / vw, DETECT_MAX_DIM / vh, 1);
      const dw = Math.round(vw * scale);
      const dh = Math.round(vh * scale);

      if (detectCanvas.width !== dw || detectCanvas.height !== dh) {
        detectCanvas.width = dw;
        detectCanvas.height = dh;
      }
      detectCtx.drawImage(video, 0, 0, dw, dh);

      let code = null;
      let qrText = null;
      let bbox = null;

      // 1. Primary: Enhanced jsQR
      try {
        const imgData = detectCtx.getImageData(0, 0, dw, dh);
        code = jsQR(imgData.data, dw, dh);
        if (code && code.data) {
          qrText = code.data;
          const loc = code.location;
          const minX = Math.min(loc.topLeftCorner.x, loc.topRightCorner.x, loc.bottomLeftCorner.x, loc.bottomRightCorner.x);
          const maxX = Math.max(loc.topLeftCorner.x, loc.topRightCorner.x, loc.bottomLeftCorner.x, loc.bottomRightCorner.x);
          const minY = Math.min(loc.topLeftCorner.y, loc.topRightCorner.y, loc.bottomLeftCorner.y, loc.bottomRightCorner.y);
          const maxY = Math.max(loc.topLeftCorner.y, loc.topRightCorner.y, loc.bottomLeftCorner.y, loc.bottomRightCorner.y);
          bbox = { x: minX, y: minY, w: maxX - minX, h: maxY - minY };
        }
      } catch (_) {}

      // 2. Fallback: Native BarcodeDetector + ROI extraction
      if (!code && useNative && nativeDetector) {
        try {
          const results = await nativeDetector.detect(detectCanvas);
          if (results.length > 0) {
            qrText = results[0].rawValue;
            const bb = results[0].boundingBox;
            bbox = { x: bb.x, y: bb.y, w: bb.width, h: bb.height };

            try {
              const cropPad = 0.2;
              const fx = bbox.x / scale;
              const fy = bbox.y / scale;
              const fw = bbox.w / scale;
              const fh = bbox.h / scale;
              const side = Math.max(fw, fh);
              const paddedSide = side * (1 + cropPad * 2);
              const cx = Math.max(0, Math.min(vw - 1, (fx + fw / 2) - paddedSide / 2));
              const cy = Math.max(0, Math.min(vh - 1, (fy + fh / 2) - paddedSide / 2));
              const cw = Math.min(paddedSide, vw - cx);
              const ch = Math.min(paddedSide, vh - cy);

              if (cw > 20 && ch > 20) {
                const roiDim = Math.min(480, Math.max(Math.round(cw), Math.round(ch)));
                roiCanvas.width = roiDim;
                roiCanvas.height = roiDim;
                roiCtx.drawImage(video, cx, cy, cw, ch, 0, 0, roiDim, roiDim);
                const roiData = roiCtx.getImageData(0, 0, roiDim, roiDim);
                const roiCode = jsQR(roiData.data, roiDim, roiDim);
                if (roiCode && roiCode.data) code = roiCode;
              }
            } catch (_) {}

            if (!code) code = { data: qrText };
          }
        } catch (_) {}
      }

      // No QR in frame
      if (!qrText || !bbox) {
        overlay.style.display = 'none';
        cameraWrap.classList.remove('has-qr');
        if (now - lastSeenQrTime > 2000) {
          lastQRText = null;
          statusVal.className = 'viewfinder-status';
          statusVal.textContent = 'Align QR in frame';
        }
        return;
      }
      lastSeenQrTime = now;
      cameraWrap.classList.add('has-qr');

      // Update overlay box
      showOverlay(bbox, scale);

      // Extract downscaled crop of QR region ONLY if Dual Mode is selected!
      // In Fast Mode (Matrix Only), skipping this completely deactivates the 360x360 canvas draw,
      // 518K pixel LUT loops, and software JPEG compression.
      // Payload drops from ~45KB to <1KB, latency drops to 1-3ms, and CPU overhead drops to near zero!
      const downscaledImg = (relayMode === 'dual') ? extractDownscaledCrop(bbox, scale, vw, vh) : null;

      if (code) {
        code.image = downscaledImg;
      }

      // Preserve QR locally (reconstructs canonical/exact matrix and bundles downscaled crop if available)
      let preserved = code ? QrPreserver.createPreservedQr(code) : null;
      if (!preserved && downscaledImg) {
        preserved = new QrPreserver.PreservedQr({
          payload: qrText,
          location: code ? code.location : null,
          image: downscaledImg,
          mode: 'IMAGE',
          isVerified: false,
        });
      }

      if (!preserved) {
        statusVal.className = 'viewfinder-status';
        statusVal.textContent = 'Focusing QR modules...';
        return;
      }

      const signature = (preserved.compressedMatrix || '') + ':' + (preserved.payload || '') + (relayMode === 'dual' ? (':' + Math.round(bbox.x / 12) + '_' + Math.round(bbox.y / 12)) : '');
      if (signature === lastQRText) return;
      lastQRText = signature;

      // Broadcast preserved QR via WebSocket
      const t0 = performance.now();
      if (socket && socket.readyState === WebSocket.OPEN) {
        socket.send(JSON.stringify({
          type: 'qr_preserved',
          qr: preserved.toJSON(),
        }));
        const elapsed = Math.round(performance.now() - t0);
        latencyVal.textContent = `${elapsed}ms`;
        const ecStr = preserved.errorCorrection ? `EC:${preserved.errorCorrection}` : '';
        const maskStr = preserved.maskPattern !== null ? `M${preserved.maskPattern}` : '';
        statusVal.className = 'viewfinder-status detected';
        if (preserved.mode === 'IMAGE') {
          statusVal.textContent = `Transmitted: Downscaled Image [IMAGE]`;
        } else if (relayMode === 'fast') {
          statusVal.textContent = `Transmitted: V${preserved.version || '?'} ${ecStr} ${maskStr} [⚡ Fast Matrix]`;
        } else {
          statusVal.textContent = `Transmitted: V${preserved.version || '?'} ${ecStr} ${maskStr} [Dual + Crop]`;
        }
      } else {
        statusVal.textContent = 'Detected — Relay offline';
      }
    }

    function showOverlay(bbox, scale) {
      const rect = video.getBoundingClientRect();
      const vw = video.videoWidth;
      const vh = video.videoHeight;
      if (!vw || !vh || !rect.width || !rect.height) return;

      const videoRatio = vw / vh;
      const elemRatio = rect.width / rect.height;
      let renderW, renderH, offsetX, offsetY;

      if (elemRatio > videoRatio) {
        renderW = rect.width;
        renderH = rect.width / videoRatio;
        offsetX = 0;
        offsetY = (rect.height - renderH) / 2;
      } else {
        renderH = rect.height;
        renderW = rect.height * videoRatio;
        offsetX = (rect.width - renderW) / 2;
        offsetY = 0;
      }

      const elScale = renderW / vw;
      const ox = (bbox.x / scale) * elScale + offsetX;
      const oy = (bbox.y / scale) * elScale + offsetY;
      const ow = (bbox.w / scale) * elScale;
      const oh = (bbox.h / scale) * elScale;

      overlay.style.display = 'block';
      overlay.style.left   = `${Math.round(ox)}px`;
      overlay.style.top    = `${Math.round(oy)}px`;
      overlay.style.width  = `${Math.round(ow)}px`;
      overlay.style.height = `${Math.round(oh)}px`;
    }

    /* ========== Initialize ========== */
    connectWS();
    startCamera();
  </script>
</body>
</html>
