<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>QR Relay — Scanner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-app: #090a0f;
      --bg-card: #111319;
      --bg-card-hover: #161922;
      --bg-input: #0c0e14;
      --border-subtle: #1e222d;
      --border-medium: #2a3040;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --emerald: #10b981;
      --emerald-bg: rgba(16, 185, 129, 0.08);
      --emerald-border: rgba(16, 185, 129, 0.25);
      --rose: #ef4444;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-app);
      color: var(--text-main);
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .app-layout {
      max-width: 440px;
      height: 100dvh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      padding: 10px 14px max(12px, env(safe-area-inset-bottom));
      gap: 10px;
      box-sizing: border-box;
      overflow: hidden;
    }

    /* ---- Navigation Bar ---- */
    .nav-bar {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      height: 36px;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand-mark {
      width: 26px;
      height: 26px;
      border-radius: var(--radius-sm);
      background: #1e2433;
      border: 1px solid var(--border-medium);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-main);
    }
    .brand-name {
      font-size: 0.92rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge-label {
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 1px 6px;
      border-radius: var(--radius-sm);
      background: #181d28;
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-secondary {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      font-size: 0.76rem;
      font-weight: 500;
      font-family: inherit;
      padding: 5px 10px;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
      white-space: nowrap;
    }
    .btn-secondary:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-medium);
      color: var(--text-main);
    }

    .telemetry-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 5px 9px;
      font-size: 0.72rem;
      font-weight: 600;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-muted);
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--rose);
      transition: background 0.3s;
    }
    .status-dot.online {
      background: var(--emerald);
    }

    /* ---- Camera Viewfinder Stage ---- */
    .viewfinder-wrapper {
      flex: 1;
      min-height: 0;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 2px 0;
    }

    .viewfinder-card {
      width: min(85%, calc(52dvh * 0.75), 360px);
      aspect-ratio: 3 / 4;
      background: #000;
      border: 1px solid var(--border-medium);
      border-radius: var(--radius-lg);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
      box-shadow: 0 10px 32px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.04);
    }
    .viewfinder-card video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.15s ease-out;
    }

    /* Reticle Corner Guides */
    .viewfinder-reticle {
      position: absolute;
      inset: 14px;
      pointer-events: none;
      z-index: 4;
      opacity: 0.35;
      transition: opacity 0.25s ease, border-color 0.25s ease;
    }
    .viewfinder-card.has-qr .viewfinder-reticle {
      opacity: 0.9;
    }
    .reticle-corner {
      position: absolute;
      width: 18px;
      height: 18px;
      border-color: rgba(255, 255, 255, 0.85);
      border-style: solid;
      border-width: 0;
      transition: border-color 0.2s;
    }
    .reticle-tl { top: 0; left: 0; border-top-width: 2.5px; border-left-width: 2.5px; border-top-left-radius: 6px; }
    .reticle-tr { top: 0; right: 0; border-top-width: 2.5px; border-right-width: 2.5px; border-top-right-radius: 6px; }
    .reticle-bl { bottom: 0; left: 0; border-bottom-width: 2.5px; border-left-width: 2.5px; border-bottom-left-radius: 6px; }
    .reticle-br { bottom: 0; right: 0; border-bottom-width: 2.5px; border-right-width: 2.5px; border-bottom-right-radius: 6px; }
    .viewfinder-card.has-qr .reticle-corner {
      border-color: var(--emerald);
    }

    /* Floating Lens Zoom Dock inside Viewfinder */
    .lens-dock {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(10, 12, 18, 0.76);
      border: 1px solid rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 4px 6px;
      border-radius: 9999px;
      z-index: 10;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.06);
      user-select: none;
      touch-action: manipulation;
    }

    .lens-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid transparent;
      background: transparent;
      color: rgba(255, 255, 255, 0.65);
      font-size: 0.72rem;
      font-weight: 600;
      font-family: 'JetBrains Mono', 'Inter', -apple-system, sans-serif;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.18s cubic-bezier(0.4, 0, 0.2, 1);
      padding: 0;
      line-height: 1;
      letter-spacing: -0.02em;
      -webkit-tap-highlight-color: transparent;
    }

    .lens-btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.14);
    }

    .lens-btn:active {
      transform: scale(0.9);
    }

    .lens-btn.active {
      background: rgba(255, 255, 255, 0.24);
      color: #ffffff;
      font-weight: 700;
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.3);
      transform: scale(1.08);
      border-color: rgba(255, 255, 255, 0.38);
    }

    /* Detection Bounding Box */
    .qr-bounding-box {
      position: absolute;
      border: 2px solid var(--emerald);
      background: rgba(16, 185, 129, 0.1);
      border-radius: 4px;
      display: none;
      pointer-events: none;
      z-index: 5;
      transition: all 0.08s ease-out;
    }

    /* Status Banner on Viewfinder */
    .viewfinder-status {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(12, 14, 20, 0.85);
      border: 1px solid var(--border-medium);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: var(--text-muted);
      padding: 5px 12px;
      border-radius: var(--radius-sm);
      font-size: 0.74rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      pointer-events: none;
      white-space: nowrap;
      z-index: 6;
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: 'JetBrains Mono', monospace;
    }
    .viewfinder-status.detected {
      background: rgba(16, 185, 129, 0.15);
      border-color: var(--emerald-border);
      color: var(--emerald);
    }

    /* ---- Controls Section ---- */
    .controls-card {
      flex-shrink: 0;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Primary Ready/Signal Button */
    .btn-signal {
      width: 100%;
      padding: 12px 16px;
      border: none;
      border-radius: var(--radius-sm);
      background: #2563eb;
      color: #fff;
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.15s, transform 0.1s;
    }
    .btn-signal:hover {
      background: #1d4ed8;
    }
    .btn-signal:active {
      transform: scale(0.99);
    }
    .btn-signal.sent {
      background: #059669;
    }

    /* Tooling Row */
    .tools-row {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
    }

    .tool-group {
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 6px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      min-width: 0;
      height: 38px;
    }
    .tool-icon {
      color: var(--text-dim);
      display: flex;
      flex-shrink: 0;
    }

    select.camera-dropdown {
      background: transparent;
      color: var(--text-main);
      border: none;
      font-size: 0.78rem;
      font-weight: 500;
      font-family: inherit;
      outline: none;
      cursor: pointer;
      width: 100%;
      text-overflow: ellipsis;
      white-space: nowrap;
      overflow: hidden;
    }
    select.camera-dropdown option {
      background: #111319;
      color: var(--text-main);
    }

    .zoom-slider {
      flex: 1;
      min-width: 0;
      accent-color: var(--accent);
      height: 4px;
      cursor: pointer;
    }
    .zoom-readout {
      font-size: 0.74rem;
      font-weight: 600;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-dim);
      min-width: 28px;
      text-align: right;
    }

    .btn-tool {
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      height: 38px;
      padding: 0 11px;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .btn-tool:hover {
      background: var(--bg-card-hover);
      color: var(--text-main);
    }
    .btn-tool.active {
      border-color: var(--amber-border);
      background: var(--amber-bg);
      color: var(--amber);
    }
  </style>
</head>
<body>
  <div class="app-layout">
    <!-- Navigation Bar -->
    <header class="nav-bar">
      <div class="brand-group">
        <div class="brand-mark">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
            <circle cx="12" cy="13" r="4"></circle>
          </svg>
        </div>
        <div class="brand-name">
          QR Relay <span class="badge-label">Scanner</span>
        </div>
      </div>

      <div class="nav-actions">
        <a href="/viewer.html" class="btn-secondary" title="Switch to Viewer display">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
            <line x1="8" y1="21" x2="16" y2="21"></line>
            <line x1="12" y1="17" x2="12" y2="21"></line>
          </svg>
          Viewer
        </a>

        <div class="telemetry-chip">
          <span id="dot" class="status-dot"></span>
          <span id="peersVal">S:0 V:0</span>
          <span style="opacity: 0.3;">|</span>
          <span id="latencyVal">—</span>
        </div>
      </div>
    </header>

    <!-- Camera Viewfinder -->
    <div class="viewfinder-wrapper">
      <div class="viewfinder-card" id="cameraWrap">
        <div class="viewfinder-status" id="statusVal">
          Initializing camera...
        </div>

        <video id="video" autoplay playsinline muted></video>
        <div id="scanOverlay" class="qr-bounding-box"></div>

        <!-- Viewfinder Reticle Corner Guides -->
        <div class="viewfinder-reticle" aria-hidden="true">
          <span class="reticle-corner reticle-tl"></span>
          <span class="reticle-corner reticle-tr"></span>
          <span class="reticle-corner reticle-bl"></span>
          <span class="reticle-corner reticle-br"></span>
        </div>

        <!-- Floating Lens Zoom Dock -->
        <div class="lens-dock" id="lensDock"></div>
      </div>
    </div>

    <!-- Controls Console -->
    <section class="controls-card">
      <button id="readyBtn" class="btn-signal" type="button">
        <svg id="signalIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
        </svg>
        <span id="signalText">Signal Viewer (Ready)</span>
      </button>

      <div class="tools-row">
        <div class="tool-group" style="flex: 1.2;">
          <span class="tool-icon">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
              <circle cx="12" cy="13" r="4"></circle>
            </svg>
          </span>
          <select id="camSelect" class="camera-dropdown"></select>
        </div>

        <button id="torchBtn" class="btn-tool" type="button" title="Toggle camera flashlight">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 2h6l2 7H7l2-7z"></path>
            <path d="M7 9v11a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V9"></path>
            <line x1="12" y1="12" x2="12" y2="16"></line>
          </svg>
        </button>

        <div class="tool-group">
          <span class="tool-icon">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              <line x1="11" y1="8" x2="11" y2="14"></line>
              <line x1="8" y1="11" x2="14" y2="11"></line>
            </svg>
          </span>
          <input id="zoomSlider" class="zoom-slider" type="range" min="1" max="1" step="0.1" value="1" disabled />
          <span class="zoom-readout" id="zoomVal">1.0×</span>
        </div>
      </div>

    </section>
  </div>

  <script src="/static/js/qrcodegen.js"></script>
  <script src="/static/js/jsqr-enhanced.js"></script>
  <script src="/static/js/qr-preserver.js"></script>
  <script>
    /* ========== DOM Elements ========== */
    const video        = document.getElementById('video');
    const cameraWrap   = document.getElementById('cameraWrap');
    const overlay      = document.getElementById('scanOverlay');
    const dot          = document.getElementById('dot');
    const latencyVal   = document.getElementById('latencyVal');
    const peersVal     = document.getElementById('peersVal');
    const statusVal    = document.getElementById('statusVal');
    const camSelect    = document.getElementById('camSelect');
    const zoomSlider   = document.getElementById('zoomSlider');
    const zoomVal      = document.getElementById('zoomVal');
    const torchBtn     = document.getElementById('torchBtn');
    const readyBtn     = document.getElementById('readyBtn');
    const signalIcon   = document.getElementById('signalIcon');
    const signalText   = document.getElementById('signalText');
    const lensDock     = document.getElementById('lensDock');

    /* ========== State ========== */
    const wsProto = location.protocol === 'https:' ? 'wss' : 'ws';
    const wsUrl   = `${wsProto}://${location.host}/ws`;
    let socket = null;
    let videoTrack = null;
    let activeStream = null;
    let lastQRText = null;
    let lastSeenQrTime = 0;
    let scanStarted = false;
    let lastScanTime = 0;
    let viewerCount = 0;
    let torchOn = false;
    let cachedVideoDevices = [];
    let currentLensPresets = [];
    let activeLensIndex    = -1;

    // Offscreen detection, ROI crop, and downscaled export canvases
    const detectCanvas = document.createElement('canvas');
    const detectCtx    = detectCanvas.getContext('2d', { willReadFrequently: true });
    const roiCanvas    = document.createElement('canvas');
    const roiCtx       = roiCanvas.getContext('2d', { willReadFrequently: true });
    const cropCanvas   = document.createElement('canvas');
    const cropCtx      = cropCanvas.getContext('2d', { willReadFrequently: true });

    // Pre-computed LUT for grayscale + contrast boost (factor=2.5, midpoint=128)
    const CONTRAST_LUT = new Uint8Array(256);
    (() => {
      const FACTOR = 2.5;
      for (let i = 0; i < 256; i++) {
        CONTRAST_LUT[i] = Math.max(0, Math.min(255, Math.round(FACTOR * (i - 128) + 128)));
      }
    })();

    function extractDownscaledCrop(bbox, scale, vw, vh) {
      if (!bbox || !scale || !vw || !vh) return null;
      const pad = 0.22;
      const fx = bbox.x / scale;
      const fy = bbox.y / scale;
      const fw = bbox.w / scale;
      const fh = bbox.h / scale;

      const side = Math.max(fw, fh);
      const paddedSide = side * (1 + pad * 2);
      const centerX = fx + fw / 2;
      const centerY = fy + fh / 2;
      const cx = Math.max(0, Math.round(centerX - paddedSide / 2));
      const cy = Math.max(0, Math.round(centerY - paddedSide / 2));
      const cw = Math.min(Math.round(paddedSide), vw - cx);
      const ch = Math.min(Math.round(paddedSide), vh - cy);
      const cropSide = Math.min(cw, ch);

      if (cropSide <= 20) return null;

      const CROP_SIZE = 360;
      cropCanvas.width = CROP_SIZE;
      cropCanvas.height = CROP_SIZE;
      cropCtx.drawImage(video, cx, cy, cropSide, cropSide, 0, 0, CROP_SIZE, CROP_SIZE);

      // Boost contrast and sharpen grayscale for clean QR legibility
      try {
        const imgData = cropCtx.getImageData(0, 0, CROP_SIZE, CROP_SIZE);
        const d = imgData.data;
        for (let i = 0; i < d.length; i += 4) {
          const gray = CONTRAST_LUT[Math.round(0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2])];
          d[i] = d[i + 1] = d[i + 2] = gray;
        }
        cropCtx.putImageData(imgData, 0, 0);
      } catch (_) {}

      return cropCanvas.toDataURL('image/jpeg', 0.88);
    }

    // Native BarcodeDetector (if available on Chrome/Android)
    let nativeDetector = null;
    let useNative = false;
    (async () => {
      if (window.BarcodeDetector) {
        try {
          const formats = await BarcodeDetector.getSupportedFormats();
          if (formats.includes('qr_code')) {
            nativeDetector = new BarcodeDetector({ formats: ['qr_code'] });
            useNative = true;
          }
        } catch (_) {}
      }
    })();

    /* ========== Ready / Attention Signaling ========== */
    let signalTimer = null;

    function sendReadySignal() {
      if (socket && socket.readyState === WebSocket.OPEN) {
        socket.send(JSON.stringify({ type: 'ring', action: 'start' }));
        try { localStorage.setItem('sender_sent_ring', String(Date.now())); } catch (_) {}

        readyBtn.classList.add('sent');
        signalIcon.innerHTML = `<polyline points="20 6 9 17 4 12"></polyline>`;
        signalText.textContent = 'Viewer Signaled';

        statusVal.className = 'viewfinder-status detected';
        statusVal.textContent = viewerCount > 0
          ? `Signal delivered to ${viewerCount} viewer(s)`
          : 'Signal sent (No viewers connected)';

        clearTimeout(signalTimer);
        signalTimer = setTimeout(() => {
          readyBtn.classList.remove('sent');
          signalIcon.innerHTML = `
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
          `;
          signalText.textContent = 'Signal Viewer (Ready)';
        }, 2200);
      } else {
        statusVal.textContent = 'Disconnected from relay';
      }
    }

    readyBtn.addEventListener('click', sendReadySignal);

    /* ========== WebSocket Connection ========== */
    let pingTimer = null;

    function connectWS() {
      socket = new WebSocket(wsUrl);

      socket.addEventListener('open', () => {
        dot.classList.add('online');
        socket.send(JSON.stringify({ type: 'role', role: 'sender' }));

        clearInterval(pingTimer);
        pingTimer = setInterval(() => {
          if (socket && socket.readyState === WebSocket.OPEN) {
            socket.send(JSON.stringify({ type: 'ping' }));
          }
        }, 20000);
      });

      socket.addEventListener('message', (ev) => {
        try {
          const msg = JSON.parse(ev.data);
          if (msg && msg.type === 'status') {
            viewerCount = msg.viewers || 0;
            peersVal.textContent = `S:${msg.senders} V:${msg.viewers}`;
          }
        } catch (_) {}
      });

      socket.addEventListener('close', () => {
        clearInterval(pingTimer);
        dot.classList.remove('online');
        peersVal.textContent = 'Offline';
        setTimeout(connectWS, 1500);
      });

      socket.addEventListener('error', () => {
        socket.close();
      });
    }

    /* ========== Camera Engine ========== */
    async function startCamera(deviceId) {
      if (activeStream) {
        activeStream.getTracks().forEach((t) => t.stop());
        activeStream = null;
        videoTrack = null;
      }

      const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
      const videoConstraints = {
        width:  { ideal: 1920, min: 640 },
        height: { ideal: 1080, min: 480 },
      };

      if (deviceId) {
        videoConstraints.deviceId = { exact: deviceId };
      } else {
        videoConstraints.facingMode = { ideal: 'environment' };
      }

      if (isMobile) {
        videoConstraints.focusMode = { ideal: 'continuous' };
        videoConstraints.exposureMode = { ideal: 'continuous' };
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: videoConstraints,
          audio: false,
        });

        activeStream = stream;
        video.srcObject = stream;
        videoTrack = stream.getVideoTracks()[0];

        await video.play();
        setupZoom();
        setupTorch();

        if (!scanStarted) {
          scanStarted = true;
          requestAnimationFrame(tick);
        }

        await populateCameras();
        statusVal.className = 'viewfinder-status';
        statusVal.textContent = 'Align QR in frame';
      } catch (err) {
        console.error('Camera error:', err);
        statusVal.textContent = 'Camera blocked: ' + err.message;
      }
    }

    async function populateCameras() {
      try {
        const devices = await navigator.mediaDevices.enumerateDevices();
        cachedVideoDevices = devices.filter((d) => d.kind === 'videoinput');

        camSelect.innerHTML = '';
        cachedVideoDevices.forEach((dev, idx) => {
          const opt = document.createElement('option');
          opt.value = dev.deviceId;
          opt.textContent = dev.label || `Camera ${idx + 1}`;
          camSelect.appendChild(opt);
        });

        if (videoTrack && videoTrack.getSettings) {
          const curId = videoTrack.getSettings().deviceId;
          if (curId) camSelect.value = curId;
        }

        setupLensDock();
      } catch (_) {}
    }

    camSelect.addEventListener('change', () => {
      if (camSelect.value) startCamera(camSelect.value);
    });

    /* ========== Torch (Flashlight) Support ========== */
    function setupTorch() {
      if (!videoTrack || !videoTrack.getCapabilities) return;
      const caps = videoTrack.getCapabilities();
      if (caps.torch) {
        torchBtn.style.display = 'inline-flex';
        torchBtn.onclick = async () => {
          torchOn = !torchOn;
          try {
            await videoTrack.applyConstraints({ advanced: [{ torch: torchOn }] });
            torchBtn.classList.toggle('active', torchOn);
          } catch (_) {}
        };
      } else {
        torchBtn.style.display = 'none';
      }
    }

    /* ========== Zoom & Lens Controls ========== */
    function setupZoom() {
      if (!videoTrack) return;
      const caps = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};

      if (caps.zoom) {
        zoomSlider.min = caps.zoom.min;
        zoomSlider.max = caps.zoom.max;
        zoomSlider.step = caps.zoom.step || 0.1;
        const curZoom = (videoTrack.getSettings ? videoTrack.getSettings().zoom : null) || caps.zoom.min;
        zoomSlider.value = curZoom;
        zoomVal.textContent = `${Number(curZoom).toFixed(1)}×`;
        zoomSlider.disabled = false;
        zoomSlider.oninput = () => applyZoom(parseFloat(zoomSlider.value));
      } else {
        zoomSlider.min = 0.6;
        zoomSlider.max = 3.0;
        zoomSlider.step = 0.1;
        zoomSlider.value = 1.0;
        zoomSlider.disabled = false;
        zoomVal.textContent = '1.0×';
        zoomSlider.oninput = () => applyZoom(parseFloat(zoomSlider.value));
      }

      setupPinchToZoom(caps);
      setupLensDock();
    }

    function applyZoom(val) {
      const caps = (videoTrack && videoTrack.getCapabilities) ? videoTrack.getCapabilities() : {};

      if (caps.zoom) {
        const clamped = Math.max(caps.zoom.min, Math.min(caps.zoom.max, val));
        videoTrack.applyConstraints({ advanced: [{ zoom: clamped }] }).catch(() => {});
        video.style.transform = '';
        zoomSlider.value = clamped;
        zoomVal.textContent = `${clamped.toFixed(1)}×`;
        highlightActiveLens(clamped);
      } else {
        const clamped = Math.max(0.6, Math.min(4.0, val));
        if (clamped === 1.0) {
          video.style.transform = '';
        } else {
          video.style.transform = `scale(${clamped})`;
        }
        zoomSlider.value = clamped;
        zoomVal.textContent = `${clamped.toFixed(1)}×`;
        highlightActiveLens(clamped);
      }
    }

    function setupPinchToZoom(caps) {
      let pinchStartDist = 0;
      let pinchStartZoom = 1;

      cameraWrap.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2) {
          pinchStartDist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
          pinchStartZoom = parseFloat(zoomSlider.value) || 1;
        }
      }, { passive: true });

      cameraWrap.addEventListener('touchmove', (e) => {
        if (e.touches.length === 2 && pinchStartDist > 0) {
          const dist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
          applyZoom(pinchStartZoom * (dist / pinchStartDist));
        }
      }, { passive: true });

      cameraWrap.addEventListener('touchend', (e) => {
        if (e.touches.length < 2) pinchStartDist = 0;
      }, { passive: true });
    }

    /* ========== Lens Zoom Dock Engine ========== */
    function setupLensDock() {
      if (!lensDock) return;
      const caps = (videoTrack && videoTrack.getCapabilities) ? videoTrack.getCapabilities() : {};
      const settings = (videoTrack && videoTrack.getSettings) ? videoTrack.getSettings() : {};
      const curZoom = settings.zoom || parseFloat(zoomSlider.value) || 1.0;

      currentLensPresets = buildLensPresets(caps, cachedVideoDevices);

      lensDock.innerHTML = '';
      if (!currentLensPresets || currentLensPresets.length === 0) {
        lensDock.style.display = 'none';
        return;
      }
      lensDock.style.display = 'inline-flex';

      currentLensPresets.forEach((preset, idx) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'lens-btn';
        btn.textContent = preset.label;
        btn.title = `Switch to ${preset.label} zoom`;
        btn.dataset.index = String(idx);

        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          setLensPreset(preset, idx);
        });

        lensDock.appendChild(btn);
      });

      highlightActiveLens(curZoom);
    }

    function buildLensPresets(caps, devices) {
      const presets = [];
      const hasZoomCap = Boolean(caps && caps.zoom);
      const minZ = hasZoomCap ? caps.zoom.min : 1.0;
      const maxZ = hasZoomCap ? caps.zoom.max : 1.0;

      // 1. Ultra-wide preset (< 1.0x)
      let ultraWideDevice = (devices || []).find(d => /ultra|0\.[56]|wide-angle|wideangle/i.test(d.label));
      if (hasZoomCap && minZ <= 0.85) {
        const val = minZ <= 0.55 ? 0.5 : 0.6;
        presets.push({
          label: val === 0.5 ? '0.5×' : '0.6×',
          zoom: val,
          type: 'hw'
        });
      } else if (ultraWideDevice) {
        presets.push({
          label: '0.6×',
          zoom: 0.6,
          deviceId: ultraWideDevice.deviceId,
          type: 'device'
        });
      } else {
        // Universal 0.6x preset (hardware clamped or simulated fallback)
        presets.push({
          label: '0.6×',
          zoom: 0.6,
          type: (hasZoomCap && minZ <= 0.6) ? 'hw' : 'simulated'
        });
      }

      // 2. Standard 1.0x Wide preset
      presets.push({
        label: '1×',
        zoom: 1.0,
        type: 'hw'
      });

      // 3. Telephoto / Zoom presets (2x, 3x)
      let teleDevice = (devices || []).find(d => /tele|3x|2x/i.test(d.label));
      if (hasZoomCap) {
        if (maxZ >= 2.8) {
          if (maxZ >= 4.5) {
            presets.push({ label: '2×', zoom: 2.0, type: 'hw' });
            presets.push({ label: '3×', zoom: 3.0, type: 'hw' });
          } else {
            presets.push({ label: '3×', zoom: Math.min(3.0, maxZ), type: 'hw' });
          }
        } else if (maxZ >= 1.8) {
          presets.push({ label: '2×', zoom: 2.0, type: 'hw' });
        } else {
          presets.push({ label: '3×', zoom: 3.0, type: 'simulated' });
        }
      } else if (teleDevice) {
        presets.push({
          label: '3×',
          zoom: 3.0,
          deviceId: teleDevice.deviceId,
          type: 'device'
        });
      } else {
        presets.push({
          label: '3×',
          zoom: 3.0,
          type: 'simulated'
        });
      }

      return presets;
    }

    function setLensPreset(preset, idx) {
      if (navigator.vibrate) {
        try { navigator.vibrate(12); } catch (_) {}
      }

      if (preset.type === 'device' && preset.deviceId) {
        startCamera(preset.deviceId);
        highlightActivePresetIndex(idx);
        return;
      }

      applyZoom(preset.zoom);
      highlightActivePresetIndex(idx);
    }

    function highlightActivePresetIndex(idx) {
      activeLensIndex = idx;
      if (!lensDock) return;
      const btns = lensDock.querySelectorAll('.lens-btn');
      btns.forEach((btn, i) => {
        btn.classList.toggle('active', i === idx);
      });
    }

    function highlightActiveLens(currentZoomVal) {
      if (!currentLensPresets || !currentLensPresets.length) return;
      const z = Number(currentZoomVal) || 1.0;
      let closestIdx = -1;
      let minDiff = Infinity;

      currentLensPresets.forEach((p, i) => {
        const diff = Math.abs(p.zoom - z);
        if (diff < minDiff) {
          minDiff = diff;
          closestIdx = i;
        }
      });

      if (minDiff <= 0.4) {
        highlightActivePresetIndex(closestIdx);
      } else {
        highlightActivePresetIndex(-1);
      }
    }

    /* ========== Detection & Exact Preservation Loop ========== */
    const SCAN_INTERVAL = 80;   // ms — ~12 Hz
    const DETECT_MAX_DIM = 480;  // fast downscaled frame

    async function tick() {
      requestAnimationFrame(tick);
      if (video.readyState < video.HAVE_ENOUGH_DATA) return;

      const now = performance.now();
      if (now - lastScanTime < SCAN_INTERVAL) return;
      lastScanTime = now;

      const vw = video.videoWidth;
      const vh = video.videoHeight;
      if (!vw || !vh) return;

      const scale = Math.min(DETECT_MAX_DIM / vw, DETECT_MAX_DIM / vh, 1);
      const dw = Math.round(vw * scale);
      const dh = Math.round(vh * scale);

      if (detectCanvas.width !== dw || detectCanvas.height !== dh) {
        detectCanvas.width = dw;
        detectCanvas.height = dh;
      }
      detectCtx.drawImage(video, 0, 0, dw, dh);

      let code = null;
      let qrText = null;
      let bbox = null;

      // 1. Primary: Enhanced jsQR
      try {
        const imgData = detectCtx.getImageData(0, 0, dw, dh);
        code = jsQR(imgData.data, dw, dh);
        if (code && code.data) {
          qrText = code.data;
          const loc = code.location;
          const minX = Math.min(loc.topLeftCorner.x, loc.topRightCorner.x, loc.bottomLeftCorner.x, loc.bottomRightCorner.x);
          const maxX = Math.max(loc.topLeftCorner.x, loc.topRightCorner.x, loc.bottomLeftCorner.x, loc.bottomRightCorner.x);
          const minY = Math.min(loc.topLeftCorner.y, loc.topRightCorner.y, loc.bottomLeftCorner.y, loc.bottomRightCorner.y);
          const maxY = Math.max(loc.topLeftCorner.y, loc.topRightCorner.y, loc.bottomLeftCorner.y, loc.bottomRightCorner.y);
          bbox = { x: minX, y: minY, w: maxX - minX, h: maxY - minY };
        }
      } catch (_) {}

      // 2. Fallback: Native BarcodeDetector + ROI extraction
      if (!code && useNative && nativeDetector) {
        try {
          const results = await nativeDetector.detect(detectCanvas);
          if (results.length > 0) {
            qrText = results[0].rawValue;
            const bb = results[0].boundingBox;
            bbox = { x: bb.x, y: bb.y, w: bb.width, h: bb.height };

            try {
              const cropPad = 0.2;
              const fx = bbox.x / scale;
              const fy = bbox.y / scale;
              const fw = bbox.w / scale;
              const fh = bbox.h / scale;
              const side = Math.max(fw, fh);
              const paddedSide = side * (1 + cropPad * 2);
              const cx = Math.max(0, Math.min(vw - 1, (fx + fw / 2) - paddedSide / 2));
              const cy = Math.max(0, Math.min(vh - 1, (fy + fh / 2) - paddedSide / 2));
              const cw = Math.min(paddedSide, vw - cx);
              const ch = Math.min(paddedSide, vh - cy);

              if (cw > 20 && ch > 20) {
                const roiDim = Math.min(480, Math.max(Math.round(cw), Math.round(ch)));
                roiCanvas.width = roiDim;
                roiCanvas.height = roiDim;
                roiCtx.drawImage(video, cx, cy, cw, ch, 0, 0, roiDim, roiDim);
                const roiData = roiCtx.getImageData(0, 0, roiDim, roiDim);
                const roiCode = jsQR(roiData.data, roiDim, roiDim);
                if (roiCode && roiCode.data) code = roiCode;
              }
            } catch (_) {}

            if (!code) code = { data: qrText };
          }
        } catch (_) {}
      }

      // No QR in frame
      if (!qrText || !bbox) {
        overlay.style.display = 'none';
        cameraWrap.classList.remove('has-qr');
        if (now - lastSeenQrTime > 2000) {
          lastQRText = null;
          statusVal.className = 'viewfinder-status';
          statusVal.textContent = 'Align QR in frame';
        }
        return;
      }
      lastSeenQrTime = now;
      cameraWrap.classList.add('has-qr');

      // Update overlay box
      showOverlay(bbox, scale);

      // Extract downscaled crop of QR region from camera video
      const downscaledImg = extractDownscaledCrop(bbox, scale, vw, vh);

      if (code) {
        code.image = downscaledImg;
      }

      // Preserve QR locally (reconstructs canonical/exact matrix and bundles downscaled crop)
      let preserved = code ? QrPreserver.createPreservedQr(code) : null;
      if (!preserved && downscaledImg) {
        preserved = new QrPreserver.PreservedQr({
          payload: qrText,
          location: code ? code.location : null,
          image: downscaledImg,
          mode: 'IMAGE',
          isVerified: false,
        });
      }

      if (!preserved) {
        statusVal.className = 'viewfinder-status';
        statusVal.textContent = 'Focusing QR modules...';
        return;
      }

      const signature = (preserved.compressedMatrix || '') + ':' + (preserved.payload || '') + (preserved.mode === 'IMAGE' ? (':' + Math.round(bbox.x / 12) + '_' + Math.round(bbox.y / 12)) : '');
      if (signature === lastQRText) return;
      lastQRText = signature;

      // Broadcast preserved QR via WebSocket
      const t0 = performance.now();
      if (socket && socket.readyState === WebSocket.OPEN) {
        socket.send(JSON.stringify({
          type: 'qr_preserved',
          qr: preserved.toJSON(),
        }));
        const elapsed = Math.round(performance.now() - t0);
        latencyVal.textContent = `${elapsed}ms`;
        const ecStr = preserved.errorCorrection ? `EC:${preserved.errorCorrection}` : '';
        const maskStr = preserved.maskPattern !== null ? `M${preserved.maskPattern}` : '';
        statusVal.className = 'viewfinder-status detected';
        if (preserved.mode === 'IMAGE') {
          statusVal.textContent = `Transmitted: Downscaled Image [IMAGE]`;
        } else {
          statusVal.textContent = `Transmitted: V${preserved.version || '?'} ${ecStr} ${maskStr} [Reconstructed + Crop]`;
        }
      } else {
        statusVal.textContent = 'Detected — Relay offline';
      }
    }

    function showOverlay(bbox, scale) {
      const rect = video.getBoundingClientRect();
      const vw = video.videoWidth;
      const vh = video.videoHeight;
      if (!vw || !vh || !rect.width || !rect.height) return;

      const videoRatio = vw / vh;
      const elemRatio = rect.width / rect.height;
      let renderW, renderH, offsetX, offsetY;

      if (elemRatio > videoRatio) {
        renderW = rect.width;
        renderH = rect.width / videoRatio;
        offsetX = 0;
        offsetY = (rect.height - renderH) / 2;
      } else {
        renderH = rect.height;
        renderW = rect.height * videoRatio;
        offsetX = (rect.width - renderW) / 2;
        offsetY = 0;
      }

      const elScale = renderW / vw;
      const ox = (bbox.x / scale) * elScale + offsetX;
      const oy = (bbox.y / scale) * elScale + offsetY;
      const ow = (bbox.w / scale) * elScale;
      const oh = (bbox.h / scale) * elScale;

      overlay.style.display = 'block';
      overlay.style.left   = `${Math.round(ox)}px`;
      overlay.style.top    = `${Math.round(oy)}px`;
      overlay.style.width  = `${Math.round(ow)}px`;
      overlay.style.height = `${Math.round(oh)}px`;
    }

    /* ========== Initialize ========== */
    connectWS();
    startCamera();
  </script>
</body>
